<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f0f;
            --surface: #181818;
            --surface2: #222222;
            --border: #2e2e2e;
            --border-bright: #444;
            --text: #e8e8e8;
            --text-muted: #888;
            --text-dim: #555;
            --accent: #c8f564;
            --accent-dim: #8aab3a;
            --accent-bg: rgba(200, 245, 100, 0.07);
            --red: #ff5f5f;
            --red-bg: rgba(255, 95, 95, 0.08);
            --amber: #f5a623;
            --amber-bg: rgba(245, 166, 35, 0.08);
            --blue: #5b9cf6;
            --blue-bg: rgba(91, 156, 246, 0.08);
            --radius: 4px;
            --font-mono: 'IBM Plex Mono', monospace;
            --font-sans: 'IBM Plex Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Layout */
        .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }
        .logo span { display: block; color: var(--text-muted); font-size: 10px; margin-top: 4px; letter-spacing: 0.08em; }

        .section-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        /* Forms */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }

        input[type="text"],
        input[type="number"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 13px;
            padding: 8px 10px;
            border-radius: var(--radius);
            width: 100%;
            transition: border-color 0.15s;
            outline: none;
        }
        input[type="text"]:focus,
        input[type="number"]:focus { border-color: var(--accent-dim); }
        input::placeholder { color: var(--text-dim); }

        .btn {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--border-bright); color: var(--text); }

        .btn-accent {
            background: var(--accent-bg);
            border-color: var(--accent-dim);
            color: var(--accent);
        }
        .btn-accent:hover { background: rgba(200, 245, 100, 0.14); color: var(--accent); }

        .btn-danger {
            background: var(--red-bg);
            border-color: var(--red);
            color: var(--red);
        }
        .btn-danger:hover { background: rgba(255, 95, 95, 0.15); }

        .btn-amber {
            background: var(--amber-bg);
            border-color: var(--amber);
            color: var(--amber);
        }
        .btn-amber:hover { background: rgba(245, 166, 35, 0.15); }

        .btn-blue {
            background: var(--blue-bg);
            border-color: var(--blue);
            color: var(--blue);
        }
        .btn-blue:hover { background: rgba(91, 156, 246, 0.15); }

        .btn-full { width: 100%; text-align: center; padding: 9px; }

        /* Main content */
        .main { padding: 2rem 2.5rem; overflow-x: auto; }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .main-title {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Flash message */
        .flash {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            padding: 7px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--accent-dim);
            background: var(--accent-bg);
            color: var(--accent);
        }
        .flash::before { content: '›'; font-size: 14px; }

        /* Table */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead tr {
            border-bottom: 1px solid var(--border);
        }

        th {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 0 16px 10px 0;
            text-align: left;
            font-weight: 400;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }
        tbody tr:hover { background: var(--surface2); }

        td {
            padding: 12px 16px 12px 0;
            vertical-align: middle;
            color: var(--text);
        }

        td:first-child { font-weight: 500; }

        .price-cell {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
        }

        .qty-cell {
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .qty-zero { color: var(--red); }
        .qty-low  { color: var(--amber); }

        .category-pill {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 2px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Inline action forms */
        .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .actions input[type="number"] { width: 70px; padding: 6px 8px; font-size: 12px; }
        .actions .btn { font-size: 10px; padding: 6px 10px; }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
        }
        .empty span { display: block; font-size: 24px; margin-bottom: 1rem; opacity: 0.3; }

        /* Search result indicator */
        .result-count {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 1rem;
            letter-spacing: 0.06em;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
    </style>
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            Inventory<br>
            <span>Management System</span>
        </div>

        <!-- Add Item -->
        <div>
            <div class="section-label">Add item</div>
            <form th:action="@{/add}" method="post">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name" required/>
                    <input type="text" name="category" placeholder="Category"/>
                    <input type="number" name="quantity" placeholder="Quantity" min="1" required/>
                    <input type="number" name="price" step="0.01" placeholder="Price" min="0.01" required/>
                </div>
                <button type="submit" class="btn btn-accent btn-full">+ Add</button>
            </form>
        </div>

        <!-- Search -->
        <div>
            <div class="section-label">Search</div>
            <form th:action="@{/search}" method="get">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Item name" required/>
                    <input type="text" name="category" placeholder="Category (optional)"/>
                </div>
                <button type="submit" class="btn btn-full">Search</button>
            </form>
        </div>

    </aside>

    <!-- Main -->
    <main class="main">

        <div class="main-header">
            <div class="main-title">Stock overview</div>
            <div th:if="${message}" class="flash" th:text="${message}"></div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="5">
                        <div class="empty">
                            <span>◻</span>
                            no items found
                        </div>
                    </td>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.name}"></td>
                    <td>
                        <span class="category-pill" th:text="${item.category}"></span>
                    </td>
                    <td>
                            <span class="qty-cell"
                                  th:classappend="${item.quantity == 0} ? 'qty-zero' : (${item.quantity < 5} ? 'qty-low' : '')"
                                  th:text="${item.quantity}">
                            </span>
                    </td>
                    <td>
                        <span class="price-cell" th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></span>
                    </td>
                    <td>
                        <div class="actions">
                            <!-- Sell -->
                            <form th:action="@{/sell}" method="post">
                                <input type="hidden" th:value="${item.name}" name="name"/>
                                <input type="hidden" th:value="${item.category}" name="category"/>
                                <input type="number" name="quantity" min="1" placeholder="Qty"/>
                                <button type="submit" class="btn btn-blue">Sell</button>
                            </form>
                            <!-- Update Price -->
                            <form th:action="@{/update/{id}(id=${item.id})}" method="post">
                                <input type="number" name="price" step="0.01" placeholder="Price"/>
                                <button type="submit" class="btn btn-amber">Update</button>
                            </form>
                            <!-- Delete -->
                            <form th:action="@{/delete/{id}(id=${item.id})}" method="post">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

</body>
</html>
